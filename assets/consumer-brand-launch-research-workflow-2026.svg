" stroke="#3e7d9d" stroke-width="3" stroke-linecap="round"/><rect x="720" y="110" width="202" height="132" rx="11" fill="#eef5f9" stroke="#a8c6d6" stroke-width="1.5"/><text x="821" y="157" fill="#0e3455" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle">04</text><text x="821" y="190" fill="#19334a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="middle">Упаковка и SKU</text><path d="M924 176 h16" stroke="#3e7d9d" stroke-width="3" stroke-linecap="round"/><rect x="948" y="110" width="202" height="132" rx="11" fill="#eef5f9" stroke="#a8c6d6" stroke-width="1.5"/><text x="1049" y="157" fill="#0e3455" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle">05</text><text x="1049" y="190" fill="#19334a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="middle">Материалы</text><text x="1049" y="213" fill="#19334a" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" text-anchor="middle">запуска</text><text x="45" y="312" fill="#50667d" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Этапы оцениваются раздельно, с проверкой атрибуции конкретному агентству.</text></svg>